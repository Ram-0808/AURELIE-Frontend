<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AURÉLIE</title>
    <script>
      // Single-Page-App redirect for GitHub Pages.
      // A refresh on a deep route (e.g. /AURELIE-Frontend/collections) lands
      // here; we rewrite the URL into a query the app can restore, then bounce
      // to the app root. Technique: rafgraph/spa-github-pages (MIT).
      // pathSegmentsToKeep = 1 keeps the repo name in the path.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
